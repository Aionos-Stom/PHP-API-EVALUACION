expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL
memory_limit=256M
max_execution_time=30
post_max_size=32K
upload_max_filesize=1K
file_uploads=Off
session.upload_progress.enabled=0
fatal_error_backtraces=0
allow_url_include=Off
zend.exception_ignore_args=On
date.timezone=UTC
